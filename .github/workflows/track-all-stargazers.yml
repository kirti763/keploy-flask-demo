name: Track Keploy Main Stargazers

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-stargazers:
    name: Fetch & Commit Stargazers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run stargazer tracker
        id: tracker
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          set +e
          node scripts/fetch-keploy-stargazers.js
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check exit code
        run: |
          CODE=${{ steps.tracker.outputs.exit_code }}
          echo "Tracker script exit code: '${CODE}'"

          # Fail if exit code is missing/undefined
          if [ -z "$CODE" ]; then
            echo "❌ Script did not report an exit code. Treating as failure."
            exit 1
          fi

          # Allow only expected success codes: 0 = updated, 2 = no new stargazers
          if [ "$CODE" = "0" ] || [ "$CODE" = "2" ]; then
            echo "✅ Script completed successfully with exit code $CODE."
            exit 0
          fi

          echo "❌ Script failed with unexpected exit code: $CODE"
          exit 1
      - name: Commit updated CSV
        if: steps.tracker.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/keploy-stargazers.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): update keploy-stargazers CSV [${TIMESTAMP}]"
            git push
            echo "✅ CSV committed and pushed."
          fi
