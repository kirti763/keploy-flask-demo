name: Track Keploy Issues

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 03:00 UTC
  workflow_dispatch:       

permissions:
  contents: write

concurrency:
  group: track-issues-csv
  cancel-in-progress: false

jobs:
  fetch-issues:
    name: Fetch & Commit Issues
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run issues tracker
        id: tracker
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          set +e
          node scripts/fetch-new-issues.js
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Check exit code
        run: |
          CODE=${{ steps.tracker.outputs.exit_code }}
          if [ "$CODE" = "1" ]; then
            echo "❌ Script failed with a fatal error."
            exit 1
          fi
          echo "Script finished with code $CODE"

      - name: Commit updated CSVs
        if: steps.tracker.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/new-issues.csv data/closed-issues.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): update issues CSVs [${TIMESTAMP}]"
            git push
            echo "✅ CSVs committed and pushed."
          fi
