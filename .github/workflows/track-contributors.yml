name: Track Keploy Contributors
 
on:
  schedule:
    - cron: "0 5 * * *"   # runs daily at 05:00 UTC
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: track-contributors-csv
  cancel-in-progress: false
 
jobs:
  fetch-contributors:
    name: Fetch & Commit Contributors
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
 
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Run contributor tracker
        id: tracker
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          set +e
          node scripts/fetch-contributors.js
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0
 
      - name: Check exit code
        run: |
          CODE=${{ steps.tracker.outputs.exit_code }}
          echo "Tracker script exit code: '${CODE}'"
          if [ -z "$CODE" ]; then
            echo "❌ Script did not report an exit code. Treating as failure."
            exit 1
          fi
          if [ "$CODE" = "0" ] || [ "$CODE" = "2" ]; then
            echo "✅ Script completed successfully with exit code $CODE."
            exit 0
          fi
          echo "❌ Script failed with unexpected exit code: $CODE"
          exit 1
 
      - name: Commit updated CSV
        if: steps.tracker.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/contributors.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): update contributors CSV [${TIMESTAMP}]"
            git push origin main
            echo "✅ CSV committed and pushed."
          fi
