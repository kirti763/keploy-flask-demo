name: Track Keploy PRs

on:
  schedule:
    - cron: "0 4 * * *"  
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  fetch-prs:
    name: Fetch & Commit PRs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PR tracker
        id: tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-all-prs.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check exit code
        run: |
          CODE=${{ steps.tracker.outputs.exit_code }}
          if [ "$CODE" = "1" ]; then
            echo "❌ Script failed with a fatal error."
            exit 1
          fi
          echo "Script finished with code $CODE"

      - name: Commit updated CSVs
        if: steps.tracker.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/open-prs.csv data/merged-prs.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): update PRs CSVs [${TIMESTAMP}]"
            git pull --rebase
            git push
            echo "✅ CSVs committed and pushed."
          fi
